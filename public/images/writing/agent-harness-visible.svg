<text x="1370.0" y="390.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Code change</text>
<line x1="1482" y1="380" x2="1530" y2="380" stroke="#8a857c" stroke-width="3" marker-end="url(#a-k)"/>
<rect x="1540" y="330" width="200" height="100" rx="8" fill="none" stroke="#1a1a1a" stroke-width="3"/>
<text x="1640.0" y="376.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Developer</text>
<text x="1640.0" y="412.0" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">judges it</text>
