<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 680" width="1800" height="680">
<defs><marker id="a-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a6b3a"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c4512a"/></marker><marker id="a-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a857c"/></marker></defs>
<rect width="1800" height="680" fill="#faf7f2"/>
<text x="80" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#1a1a1a">What sits between a prompt and a code change</text>
<g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect x="80" y="330" width="220" height="100" rx="8" fill="none" stroke="#8a857c" stroke-width="3"/>
<text x="190.0" y="390.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Request</text>
<line x1="302" y1="380" x2="380" y2="380" stroke="#8a857c" stroke-width="3" marker-end="url(#a-k)"/>
<rect x="390" y="200" width="800" height="340" rx="8" fill="none" stroke="#4a6b3a" stroke-width="3" stroke-dasharray="10 8"/>
<text x="420" y="245" font-size="24" fill="#4a6b3a" text-anchor="start" font-weight="700" letter-spacing="1.5">THE HARNESS</text>
