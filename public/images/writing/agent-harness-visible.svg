<text x="585.0" y="321.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Context</text>
<text x="585.0" y="357.0" font-size="24" fill="#4a6b3a" text-anchor="middle" font-weight="400" letter-spacing="0">what the model reads</text>
