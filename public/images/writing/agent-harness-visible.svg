<text x="585.0" y="451.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Tools</text>
<text x="585.0" y="487.0" font-size="24" fill="#4a6b3a" text-anchor="middle" font-weight="400" letter-spacing="0">what the agent can do</text>
<rect x="870" y="330" width="280" height="100" rx="8" fill="#eef2ea" stroke="#4a6b3a" stroke-width="3"/>
<text x="1010.0" y="390.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Model</text>
<line x1="752" y1="325" x2="860" y2="365" stroke="#4a6b3a" stroke-width="3" marker-end="url(#a-g)"/>
