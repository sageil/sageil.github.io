<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" width="1800" height="720">
<defs><marker id="a-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a6b3a"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c4512a"/></marker><marker id="a-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a857c"/></marker></defs>
<rect width="1800" height="720" fill="#faf7f2"/>
<text x="80" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#1a1a1a">Five agents, one person keeping track</text>
<g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect x="80" y="225" width="420" height="72" rx="8" fill="none" stroke="#8a857c" stroke-width="3"/>
<text x="290.0" y="271.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Agent in repository A</text>
<line x1="502" y1="261" x2="750" y2="364" stroke="#8a857c" stroke-width="3" marker-end="url(#a-k)"/>
<rect x="80" y="317" width="420" height="72" rx="8" fill="none" stroke="#8a857c" stroke-width="3"/>
<text x="290.0" y="363.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Agent in repository B</text>
<line x1="502" y1="353" x2="750" y2="384" stroke="#8a857c" stroke-width="3" marker-end="url(#a-k)"/>
<rect x="80" y="409" width="420" height="72" rx="8" fill="none" stroke="#8a857c" stroke-width="3"/>
<text x="290.0" y="455.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Agent in repository C</text>
<line x1="502" y1="445" x2="750" y2="404" stroke="#8a857c" stroke-width="3" marker-end="url(#a-k)"/>
<rect x="80" y="501" width="420" height="72" rx="8" fill="none" stroke="#8a857c" stroke-width="3"/>
<text x="290.0" y="547.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Agent in repository D</text>
<line x1="502" y1="537" x2="750" y2="424" stroke="#8a857c" stroke-width="3" marker-end="url(#a-k)"/>
<rect x="80" y="593" width="420" height="72" rx="8" fill="none" stroke="#8a857c" stroke-width="3"/>
<text x="290.0" y="639.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Agent in repository E</text>
<line x1="502" y1="629" x2="750" y2="444" stroke="#8a857c" stroke-width="3" marker-end="url(#a-k)"/>
<rect x="760" y="344" width="340" height="120" rx="8" fill="#fbe9e1" stroke="#c4512a" stroke-width="3"/>
<text x="930.0" y="400.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">You</text>
<text x="930.0" y="436.0" font-size="24" fill="#c4512a" text-anchor="middle" font-weight="400" letter-spacing="0">the only one who sees all five</text>
<line x1="1170" y1="225" x2="1170" y2="685" stroke="#8a857c" stroke-width="2"/>
<text x="1230" y="260" font-size="24" fill="#c4512a" text-anchor="start" font-weight="700" letter-spacing="1.5">WHAT YOU CARRY</text>
<text x="1230" y="330" font-size="28" fill="#1a1a1a" text-anchor="start" font-weight="400" letter-spacing="0">Which agent owns what</text>
<text x="1230" y="410" font-size="28" fill="#1a1a1a" text-anchor="start" font-weight="400" letter-spacing="0">A decision made 20 minutes ago</text>
<text x="1230" y="490" font-size="28" fill="#1a1a1a" text-anchor="start" font-weight="400" letter-spacing="0">Where one repository breaks another</text>
<text x="1230" y="570" font-size="28" fill="#1a1a1a" text-anchor="start" font-weight="400" letter-spacing="0">What to integrate, and when</text>
</g>
