<text x="1370.0" y="450" font-size="25" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Hidden thinking</text>
<rect x="1490" y="290" width="170" height="110" fill="#f6d6c8" stroke="#c4512a" stroke-width="3"/>
<text x="1575.0" y="450" font-size="25" fill="#1a1a1a" text-anchor="middle" font-weight="400" letter-spacing="0">Answer</text>
<text x="80" y="540" font-size="26" fill="#4a6b3a" text-anchor="start" font-weight="700" letter-spacing="0">Billed at the base input rate</text>
